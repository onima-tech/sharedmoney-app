name: PR Checks

on:
  pull_request:
    branches:
      - main
      - 'release/**'
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Test, Lint & Build
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify web lockfile (matches Vercel install)
        # Vercel installs web/ standalone with `npm ci` against web/package-lock.json.
        # Inside the repo npm resolves to the workspace root, so check a standalone copy.
        run: |
          dir="$RUNNER_TEMP/web-lockfile-check"
          mkdir -p "$dir"
          cp web/package.json web/package-lock.json "$dir/"
          cd "$dir" && npm ci --ignore-scripts --no-audit --no-fund

      - name: Run Web Tests
        run: npm run test:web

      - name: Run Web Linter
        run: npm run lint:web

      - name: Run Web Build & Typecheck
        run: npm run typecheck:web

  mobile:
    name: Mobile Typecheck & Config Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Mobile Config Tests
        run: npm run test:mobile

      - name: Run Mobile Typecheck
        run: npm run typecheck:mobile

  supabase:
    name: Supabase Edge Functions & Shared Tests
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Deno Tests
        run: deno test --allow-env tests/ supabase/functions/

      - name: Install mobile dependencies (for Deno mobile/utils tests)
        working-directory: mobile
        run: npm ci --ignore-scripts

      - name: Run Deno Tests (mobile/utils)
        working-directory: mobile
        run: deno test --allow-env utils/
